appId: 'newlegendslauncher'
productName: 'New Legends Launcher'
artifactName: 'New-Legends-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026-2027 VoidKen'

asar: true
compression: 'maximum'

# Everything in the project folder is packed unless excluded here.
files:
  - '!{dist,.gitignore,.vscode,.github,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs,README.md}'
  - '!{libraries,cache,Nebula,NewLegendsRepo,NewLegends}'
  - '!{servers,repo,distribution.json}'
  - '!**/*.{md,map,ts}'

# Where auto-update looks for new versions (GitHub Releases).
publish:
  provider: github
  owner: VoidKen
  repo: NewLegendsLauncher

# Windows Configuration
win:
  icon: 'app/assets/images/SealCircle.ico'
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: 'app/assets/images/SealCircle.ico'
  uninstallerIcon: 'app/assets/images/SealCircle.ico'

# macOS Configuration (untested)
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration (untested): AppImage only, no snap or deb
linux:
  target: 'AppImage'
  artifactName: 'New-Legends-Launcher-${version}.${ext}'
  maintainer: 'VoidKen'
  vendor: 'VoidKen'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'

directories:
  buildResources: 'build'
  output: 'dist'